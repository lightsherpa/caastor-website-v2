<!DOCTYPE html>
<html lang="en" data-theme="light" data-palette="citrus" data-font="inter" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caastor · Creative-as-a-Service</title>
    <meta
      name="description"
      content="Your on-demand design team: senior work, shipped in 48 hours. Unlimited design requests, one flat monthly fee, zero drama."
    />
    <link rel="icon" href="/assets/icon-white.svg" />
    <!-- Fonts: primary face (Geist) is self-hosted in CSS. These Google
         families load ASYNC (preload + onload swap) so they never block
         first paint; font-display:swap shows fallbacks meanwhile. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
